<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendicator — Prediction Engine Preview</title>
<style>
  :root {
    /* metallic dark grey + glass, neon lime highlights */
    --bg0:#0C0E12; --bg1:#14171D; --steel:#1C2027; --steel2:#242933;
    --glass:rgba(255,255,255,.045); --glass-edge:rgba(255,255,255,.10);
    --lime:#C6FF4D; --lime2:#9BE81F; --mint:#7CFFCB;
    --white:#F7FAF2; --muted:#9AA3B2; --amber:#FFB454; --red:#FF6B6B;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    color:var(--white); font:15px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(900px 400px at 85% -10%, rgba(198,255,77,.10), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, rgba(124,255,203,.06), transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg0) 60%);
    min-height:100vh;
  }
  /* neon streaks */
  body::before, body::after {
    content:""; position:fixed; pointer-events:none; z-index:0;
    height:2px; left:-10%; right:-10%;
    background:linear-gradient(90deg, transparent, var(--lime), transparent);
    opacity:.35; filter:blur(.5px);
  }
  body::before { top:120px; transform:rotate(-4deg); }
  body::after { top:75%; transform:rotate(3deg); opacity:.15; }

  header {
    position:relative; z-index:1; padding:24px 30px;
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
    background:linear-gradient(120deg, rgba(36,41,51,.85), rgba(20,23,29,.85));
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--glass-edge);
    box-shadow:0 1px 0 rgba(198,255,77,.25), 0 12px 40px rgba(0,0,0,.5);
  }
  header h1 { font-size:27px; letter-spacing:4px; font-weight:800; }
  header h1 span { color:var(--lime); text-shadow:0 0 18px rgba(198,255,77,.55); }
  header small { color:var(--muted); }
  .chip {
    background:linear-gradient(120deg, var(--lime), var(--lime2));
    color:#101505; font-weight:800; border-radius:999px; padding:4px 13px;
    font-size:11.5px; letter-spacing:1px;
    box-shadow:0 0 22px rgba(198,255,77,.35);
  }
  main { position:relative; z-index:1; max-width:1120px; margin:0 auto;
         padding:26px 16px 60px; display:grid; gap:18px; }
  .card {
    background:var(--glass); border:1px solid var(--glass-edge);
    border-radius:16px; padding:20px 22px; backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.45);
  }
  .fixture { display:flex; justify-content:space-between; align-items:center;
             flex-wrap:wrap; gap:12px; }
  .team { display:flex; align-items:center; gap:10px; position:relative;
          cursor:pointer; }
  .team img { width:44px; height:44px; object-fit:contain;
              filter:drop-shadow(0 0 8px rgba(198,255,77,.25)); }
  .team h2 { font-size:21px; }
  .vs { color:var(--muted); font-size:13px; letter-spacing:2px; }
  .tip {
    display:none; position:absolute; top:54px; left:0; z-index:5; width:230px;
    background:rgba(20,23,29,.97); border:1px solid rgba(198,255,77,.35);
    border-radius:12px; padding:12px 14px; font-size:12.5px;
    box-shadow:0 0 30px rgba(198,255,77,.18), 0 18px 40px rgba(0,0,0,.6);
  }
  .team:hover .tip { display:block; }
  .tip b { color:var(--lime); }
  .probbar { display:flex; height:46px; border-radius:12px; overflow:hidden;
             margin:18px 0 6px; font-weight:800; font-size:14px;
             border:1px solid var(--glass-edge); }
  .probbar div { display:flex; align-items:center; justify-content:center;
                 min-width:38px; }
  .p-home { background:linear-gradient(180deg, var(--lime), var(--lime2));
            color:#101505; text-shadow:none; }
  .p-draw { background:linear-gradient(180deg, #3A414D, #2C323C);
            color:var(--white); }
  .p-away { background:linear-gradient(180deg, var(--mint), #45D6A0);
            color:#062A1D; }
  .legend { display:flex; justify-content:space-between; color:var(--muted);
            font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
          gap:18px; }
  h3 { font-size:12.5px; text-transform:uppercase; letter-spacing:2px;
       color:var(--lime); margin-bottom:12px;
       text-shadow:0 0 14px rgba(198,255,77,.35); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:5px 4px; border-bottom:1px solid rgba(255,255,255,.06); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums;
                  font-weight:700; color:var(--white); }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; background:rgba(255,255,255,.06);
          border:1px solid var(--glass-edge); border-radius:999px;
          padding:4px 12px; margin:3px 4px 3px 0; font-size:12.5px; }
  .warn { color:var(--muted); font-size:12px; margin-top:14px; }
  .bar { height:8px; background:rgba(255,255,255,.08); border-radius:5px;
         overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%;
           background:linear-gradient(90deg, var(--lime2), var(--lime));
           box-shadow:0 0 12px rgba(198,255,77,.6); }
  footer { position:relative; z-index:1; text-align:center;
           color:var(--muted); font-size:12px; padding-bottom:30px; }
  #err { color:var(--red); padding:30px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>VENDI<span>CATOR</span></h1>
  <small id="generated">loading…</small>
  <span class="chip">SIX-ENGINE PREVIEW</span>
</header>
<main id="app"><div id="err" hidden></div></main>
<footer>Statistical analysis, not betting advice · Vendicator prediction engine</footer>
<script>
const pct = v => (typeof v === "number" ? v.toFixed(1) + "%" : v);
const TSDB = "https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=";

fetch("/model/output/predictions.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(e => { const el = document.getElementById("err");
    el.hidden = false; el.textContent = "Could not load predictions.json — run the pipeline first (" + e + ")"; });

function row(k, v) { return `<tr><td>${k}</td><td>${v}</td></tr>`; }

async function badge(team, imgId) {
  try {
    const r = await fetch(TSDB + encodeURIComponent(team));
    const d = await r.json();
    const url = d.teams && d.teams[0] && (d.teams[0].strBadge || d.teams[0].strTeamBadge);
    if (url) document.getElementById(imgId).src = url + "/preview";
  } catch (e) { /* badge is decorative; ignore */ }
}

function teamTip(name, probs, xg, side) {
  return `<span class="tip"><b>${name}</b><br>
    Win probability: <b>${pct(probs)}</b><br>
    Expected goals: <b>${xg}</b><br>
    Side: ${side} · click for full team stats (site build)</span>`;
}

function render(p) {
  document.getElementById("generated").textContent =
    "generated " + new Date(p.generated).toLocaleString();
  const f = p.final_calibrated, dc = p.markets_dixon_coles;
  const [home, away] = p.fixture.split(" vs ");
  const app = document.getElementById("app");

  app.insertAdjacentHTML("beforeend", `
  <div class="card">
    <div class="fixture">
      <div class="team">
        <img id="badge-h" alt="" src="">
        <h2>${home}</h2>
        ${teamTip(home, f.home, p.expected_goals.home, "home")}
      </div>
      <span class="vs">VS · ${p.league}</span>
      <div class="team">
        <img id="badge-a" alt="" src="">
        <h2>${away}</h2>
        ${teamTip(away, f.away, p.expected_goals.away, "away")}
      </div>
    </div>
    <div class="probbar">
      <div class="p-home" style="flex:${f.home}">${pct(f.home)}</div>
      <div class="p-draw" style="flex:${f.draw}">${pct(f.draw)}</div>
      <div class="p-away" style="flex:${f.away}">${pct(f.away)}</div>
    </div>
    <div class="legend"><span>${home} win</span><span>Draw</span>
      <span>${away} win</span></div>
    <p class="warn">Calibrated ensemble output · 90% band on home win:
      ${p.uncertainty_band_home_pct[0]}–${p.uncertainty_band_home_pct[1]}%
      · reward difficulty ×${p.reward_difficulty_multiplier}</p>
  </div>

  <div class="grid">
    <div class="card"><h3>1X2 &amp; Double Chance</h3><table>
      ${row("Home", pct(dc["1x2"].home))}${row("Draw", pct(dc["1x2"].draw))}
      ${row("Away", pct(dc["1x2"].away))}
      ${row("1X", pct(dc.double_chance["1x"]))}
      ${row("12", pct(dc.double_chance["12"]))}
      ${row("X2", pct(dc.double_chance["x2"]))}</table></div>

    <div class="card"><h3>Goals Markets</h3><table>
      ${row("BTTS yes", pct(dc.btts.yes))}${row("BTTS no", pct(dc.btts.no))}
      ${row("Over 1.5", pct(dc.totals["over_1.5"]))}
      ${row("Over 2.5", pct(dc.totals["over_2.5"]))}
      ${row("Over 3.5", pct(dc.totals["over_3.5"]))}
      ${row("Under 2.5", pct(dc.totals["under_2.5"]))}</table></div>

    <div class="card"><h3>Exact Score — top 10</h3><table>
      ${dc.exact_score_top10.map(([s, v]) => row(s, pct(v))).join("")}
    </table></div>

    <div class="card"><h3>Live Demo — 60' at 1-0</h3><table>
      ${row("Home win", pct(p.in_play_demo_60min_1_0.win_prob.home))}
      ${row("Draw", pct(p.in_play_demo_60min_1_0.win_prob.draw))}
      ${row("Away win", pct(p.in_play_demo_60min_1_0.win_prob.away))}
      ${row("Next goal: home", pct(p.in_play_demo_60min_1_0.next_goal.home))}
      ${row("Next goal: away", pct(p.in_play_demo_60min_1_0.next_goal.away))}
      ${row("No more goals", pct(p.in_play_demo_60min_1_0.next_goal.none))}
      </table>
      <p class="warn">InPlayEngine — recomputes every poll from live
      minute/score/cards</p></div>

    <div class="card"><h3>Meta-Model Trust</h3>
      ${Object.entries(p.explanation_context.meta_model_trust)
        .sort((a, b) => b[1] - a[1])
        .map(([m, w]) => `<div class="muted">${m}
          <div class="bar"><i style="width:${Math.min(w * 130, 100)}%"></i>
          </div></div>`).join("")}
      <p class="warn">How much the stacking meta-learner trusts each
      specialist model</p></div>

    <div class="card"><h3>Tactical Notes</h3>
      ${p.tactical_notes.map(n => `<span class="pill">${n}</span>`).join("")}
      <p class="warn">Rule-based for now — GNN heads take over in Phase 2;
      Claude turns these into match previews</p></div>
  </div>`);

  badge(home, "badge-h");
  badge(away, "badge-a");
}
</script>
</body>
</html>
